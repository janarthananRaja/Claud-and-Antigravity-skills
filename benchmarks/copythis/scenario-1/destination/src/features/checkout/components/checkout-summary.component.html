<div class="checkout-card">
  <div class="checkout-header">Order Summary</div>

  <div class="items-container">
    <div *ngFor="let item of items" class="item-pill-row">
      <span>{{ item.name }} (x{{ item.quantity }})</span>
      <span class="fw-bold">${{ (item.unitPrice * item.quantity).toFixed(2) }}</span>
    </div>
  </div>

  <div class="coupon-box">
    <input type="text" class="coupon-input" [(ngModel)]="couponCodeInput" placeholder="Promo code" [disabled]="isSubmitting" />
    <button class="coupon-apply-btn" (click)="applyCoupon()" [disabled]="isSubmitting">Apply</button>
  </div>
  <div *ngIf="couponMessage" class="coupon-feedback">{{ couponMessage }}</div>

  <div class="summary-breakdown">
    <div class="d-flex justify-content-between"><span>Subtotal</span><span>${{ calculation.subtotal }}</span></div>
    <div class="d-flex justify-content-between"><span>Discount</span><span>-${{ calculation.discountAmount }}</span></div>
    <div class="d-flex justify-content-between"><span>Estimated Tax (18%)</span><span>${{ calculation.taxAmount }}</span></div>
    <div class="total-row d-flex justify-content-between"><span>Total</span><span>${{ calculation.total }}</span></div>
  </div>

  <button class="submit-pill-btn" (click)="submitOrder()" [disabled]="isSubmitting || items.length === 0">
    {{ isSubmitting ? 'Confirming...' : 'Place Order' }}
  </button>
</div>
